<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEOHAE LINK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 밝은 테마. 포인트는 초록 하나만, 주황은 마감 3일 이내 배지에만. 한 화면 고정, 스크롤 없음 */
:root{
  --bg:#F4F7F5; --card:#FFFFFF; --ink:#13261C; --mute:#5D7066; --line:#DFE8E2;
  --green:#128150; --green-soft:#E6F4EC; --urgent:#E8590C;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:10px 16px 0}

/* 헤더: 로고 + 작은 이름 */
.top{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;margin:0;font-size:inherit}
.brand svg{width:32px;height:32px;flex:none}
.brand span{font-size:14px;font-weight:700;letter-spacing:.08em;line-height:1}
.brand span b{color:var(--green);font-weight:700}
.hbtns{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700}
.pill svg{width:14px;height:14px;color:var(--green)}

main{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:10px}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}

/* 오늘의 핵심 */
.hero{flex:none;width:100%;text-align:left;background:var(--green-soft);border-radius:18px;padding:14px 16px;display:grid;gap:6px;cursor:pointer}
.hero .k{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hero .kk{font-size:12.5px;font-weight:600;color:var(--mute);padding-top:3px}
.hero .big{font-size:30px;font-weight:700;line-height:1;color:var(--green);flex:none;font-variant-numeric:tabular-nums}
.hero h2{margin:0;font-size:18px;line-height:1.35;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .hk{font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .hk b{color:var(--green);margin-right:6px}
.hero.empty{cursor:default}

/* 주간 스트립: 좌우로 넘김 */
.wk{flex:none;display:grid;gap:6px;touch-action:pan-y}
.wkh{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700}
.wkh .nav{display:flex;gap:4px}
.wkh .nav button{width:30px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:15px;line-height:1;color:var(--ink)}
.wkh .nav button:disabled{opacity:.35;cursor:default}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{display:grid;justify-items:center;gap:1px;padding:5px 0;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:11px;color:var(--mute)}
.day b{font-size:16px;line-height:1.25;color:var(--ink)}
.day i{font-style:normal;min-width:18px;height:18px;border-radius:9px;background:var(--green);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.day u{height:18px}
.day.today{border:2px solid var(--green);padding-block:4px}
.day.zero{cursor:default}
.day.we b{color:var(--mute)}

.lab{flex:none;display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;margin-bottom:-4px}
.lab button{background:none;border:0;padding:0;color:var(--green);font-weight:700;font-size:13px}

/* 카드: 한마디 요약이 주인공 */
.fit{flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.card{position:relative;flex:none;width:100%;height:76px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 16px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green)}
.card.know::before{background:var(--line)}
.card:hover{border-color:#B9CFC1}
.card.off{opacity:.5}
.kick{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mute);min-height:20px}
.kick span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.one{font-size:15px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{flex:none;font-weight:700;font-size:12px;line-height:1.4;padding:1px 8px;border-radius:7px;border:1px solid var(--line);color:var(--mute);font-variant-numeric:tabular-nums;background:var(--card)}
.badge.soon{background:var(--green-soft);border-color:var(--green-soft);color:var(--green)}
.badge.hot{background:var(--urgent);border-color:var(--urgent);color:#fff}
.empty-box{border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--mute);font-size:14px}

/* 전체 탭 */
.seg4{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:#E9EFEB;border-radius:12px;padding:3px}
.seg4 button{border:0;background:none;border-radius:9px;padding:7px 0;font-size:13px;font-weight:700;color:var(--mute)}
.seg4 button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(19,38,28,.12)}
.chips{flex:none;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pager{flex:none;height:38px;display:flex;justify-content:center;align-items:center;gap:18px;font-size:13px;color:var(--mute)}
.pager button{width:40px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;font-weight:700}
.pager button:disabled{opacity:.35;cursor:default}

/* 하단 탭 2개 */
nav.tabs{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);border-top:1px solid var(--line);margin:0 -16px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;border-radius:12px;padding:7px 0;display:flex;justify-content:center;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--mute)}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-current="page"]{background:var(--green-soft);color:var(--green)}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(19,38,28,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92dvh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(19,38,28,.15)}
.sheet-in{max-width:480px;margin:0 auto;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:20px;line-height:1.3}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.catname{font-size:12.5px;font-weight:700;color:var(--mute)}
.say{background:var(--green-soft);border-radius:14px;padding:12px 14px}
.say small{display:block;font-size:12px;font-weight:700;color:var(--green)}
.say p{margin:0;font-size:17px;font-weight:700;line-height:1.45}
.hook{border-left:3px solid var(--green);padding:2px 0 2px 10px}
.hook small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.hook p{margin:0;font-weight:600}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.facts dt{color:var(--mute);font-weight:600;white-space:nowrap}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.lbl{font-size:12px;font-weight:700;color:var(--mute);margin:0 0 4px}
.hooks{display:grid;gap:3px;margin:0;padding:0;list-style:none;font-size:13.5px}
.hooks li{display:flex;gap:8px}
.hooks li b{flex:none;width:36px;color:var(--mute);font-size:12px;padding-top:1px}
.hooks li.mine{font-weight:700}
.hooks li.mine b{color:var(--green)}
.meta{font-size:12.5px;color:var(--mute);margin:0}
.meta a{color:var(--green);font-weight:700}
.trust{display:flex;flex-wrap:wrap;gap:6px}
.trust span{font-size:12px;font-weight:600;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.trust span.ok{color:var(--green);background:var(--green-soft);border-color:var(--green-soft)}
.foot{font-size:12px;color:var(--mute);margin:0}

/* 질문 */
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font:inherit;font-size:15px}
.ask button{border:0;background:var(--green);color:#fff;border-radius:12px;padding:0 18px;font-weight:700;font-size:15px}
.ex{display:flex;flex-wrap:wrap;gap:6px}
.status{font-size:14px;color:var(--mute);margin:0;min-height:1.4em}
.status.err{color:var(--urgent);font-weight:600}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.refs{display:grid;gap:6px;margin-top:10px}
.ref{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;font-size:14px}
.ref span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref em{font-style:normal;color:var(--green);font-weight:700}
.ref span.badge{flex:none}

/* 검색창: 폰 홈 화면 검색 위젯처럼 가로로 긴 알약 모양, 맨 왼쪽에 로고 */
.sbar{flex:none;width:100%;height:48px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 8px 0 9px;box-shadow:0 1px 3px rgba(19,38,28,.08);text-align:left;cursor:text}
.sbar svg.logo{width:30px;height:30px;flex:none}
.sbar .ph{flex:1;min-width:0;font-size:15px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .go{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--green)}
.sbar .go svg{width:20px;height:20px}
.sbar:hover{border-color:#B9CFC1}
.ask.sbar{cursor:auto;padding-right:5px}
.ask.sbar input{flex:1;min-width:0;border:0;background:none;padding:0;font:inherit;font-size:16px;color:var(--ink);outline:none}
.ask.sbar button{flex:none;height:38px;border:0;border-radius:999px;background:var(--green);color:#fff;padding:0 16px;font-weight:700;font-size:15px}
.ask.sbar:focus-within{border-color:var(--green)}

/* 질문 창: 위에 여백만 남기고 화면을 덮음 */
.sheet.full{top:44px;max-height:none;border-radius:22px 22px 0 0}
.sheet.full .sheet-in{min-height:100%;align-content:start}
/* 손잡이 영역: 아래로 끌어서 닫기 */
.grab-area{touch-action:none;cursor:grab;padding:4px 0 2px;margin:-10px -16px 0;display:grid;justify-items:center;gap:4px}
.grab-area .grab{width:44px;height:5px;border-radius:3px;background:#C9D6CE}
.grab-area small{font-size:11.5px;color:var(--mute)}
.sheet.drag{transition:none}
.sheet.back{transition:transform .2s ease}
.gpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gpick button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:16px 0;font-size:17px;font-weight:700;color:var(--ink)}
.gpick button:hover{border-color:var(--green);background:var(--green-soft);color:var(--green)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand" aria-label="SEOHAE LINK">
      <!-- 로고: 초록 타일 위에 서로 걸린 두 고리(학생과 학교 소식을 잇는다는 뜻) -->
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#128150"/>
        <g fill="none" stroke-width="3" stroke-linecap="round">
          <rect x="5" y="11.5" width="14" height="9" rx="4.5" transform="rotate(-35 12 16)" stroke="#FFFFFF"/>
          <rect x="13" y="11.5" width="14" height="9" rx="4.5" transform="rotate(-35 20 16)" stroke="#BFEBD2"/>
          <path d="M14.2 19.6 L16.6 17.9" transform="rotate(0)" stroke="#FFFFFF"/>
        </g>
      </svg>
      <span>SEOHAE <b>LINK</b></span>
    </h1>
    <div class="hbtns">
      <button class="pill" id="whoBtn" type="button" aria-label="학년 바꾸기"><span id="whoLabel">2학년</span></button>
    </div>
  </header>

  <main id="main">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-all" hidden></section>
  </main>

  <nav class="tabs" aria-label="메뉴">
    <button type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg>홈</button>
    <button type="button" data-tab="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>전체</button>
  </nav>
</div>

<div id="scrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden><div class="sheet-in" id="sheetIn"></div></div>

<script>
/* 헤더와 같은 로고 (검색창 맨 왼쪽에 사용) */
const LOGO = `<svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="16" fill="#128150"/><g fill="none" stroke-width="3" stroke-linecap="round"><rect x="5" y="11.5" width="14" height="9" rx="4.5" transform="rotate(-35 12 16)" stroke="#FFFFFF"/><rect x="13" y="11.5" width="14" height="9" rx="4.5" transform="rotate(-35 20 16)" stroke="#BFEBD2"/><path d="M14.2 19.6 L16.6 17.9" stroke="#FFFFFF"/></g></svg>`;
const SEARCH_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`;

/* ---------- 분류 ---------- */
const CATS = [
  {id:'contest',  name:'대회·공모전'},
  {id:'career',   name:'진로·진학'},
  {id:'class',    name:'방과후·특강'},
  {id:'exam',     name:'시험·평가'},
  {id:'health',   name:'건강·안전'},
  {id:'life',     name:'생활'},
  {id:'volunteer',name:'봉사'},
  {id:'club',     name:'동아리'},
  {id:'event',    name:'행사'},
  {id:'support',  name:'장학·지원'},
  {id:'schedule', name:'학교 일정'},
];
const catOf = id => CATS.find(c => c.id === id) || CATS[8];

const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const addDays = n => { const d = new Date(TODAY); d.setDate(d.getDate()+n); return d; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const kday = d => `${d.getMonth()+1}월 ${d.getDate()}일(${'일월화수목금토'[d.getDay()]})`;

/* ---------- 데이터 ----------
   출처: 서해고 홈페이지 가정통신문·공지사항, 서해고 10~12월 학사일정표, 교육부·대교협 입시 일정.
   one = AI가 원문을 읽고 쓴 한마디 요약, hooks = 학년별 한마디, status = AI가 무엇을 읽고 요약했는지 */
const URL_OF = (mi, bbs, id) => `https://seohae-h.goesh.kr/seohae-h/na/ntt/selectNttInfo.do?mi=${mi}&bbsId=${bbs}&nttSn=${id}`;
const G = id => URL_OF(5354, 3467, id);   // 가정통신문
const N = id => URL_OF(5353, 3466, id);   // 공지사항

const OLD_ITEMS = [
  { id:'s537821', cat:'class', title:'학생선택이음과정', grades:[1,2], deadline:'2026-11-10', noApply:true,
    summary:'대학·전문기관 연계 특강, 실험·토론·작품 제작 수업 (수강 신청은 9/30 마감)',
    what:'대학·전문기관 연계 특강, 실험 실습, 토론, 작품 제작', when:'10/27·11/3·11/10 화요일 15:00부터', where:'교내 (과정별 상이)', who:'1·2학년 중 수강 신청한 학생', how:'수강 신청은 9/30에 마감, 신청자는 남은 회차 참여',
    hooks:{1:'남은 수업 2번, 끝까지 참여하면 기록이 남아요.',2:'남은 2회차, 탐구 활동으로 마무리해요.'},
    url:G(537821), views:140, posted:'2026-10-29' },
  { id:'s537385', cat:'volunteer', title:'기브미좋아 물품 기부 캠페인', grades:[1,2,3], deadline:null,
    summary:'안 쓰는 물건을 아름다운가게에 기부하는 학생자치회 캠페인',
    what:'가정에서 안 쓰는 물품 기부 (아름다운가게 연계)', when:'원문에 없음 (첨부 HWP 확인)', where:'원문에 없음', who:'전교생·학부모', how:'원문에 없음 (첨부 HWP 확인)',
    hooks:{1:'집에 안 쓰는 물건, 기부로 바꿔봐요.',2:'나눔과 환경, 한 번에 실천해요.',3:'정리하면서 기부까지, 가볍게 참여해요.'},
    url:G(537385), views:83, posted:'2026-10-27' },
  { id:'s528521', cat:'class', title:'아침·야간 자기주도학습', grades:[1,2], deadline:null,
    summary:'누리관 자습실에서 아침·야간 자율 학습, 담임께 확인서 제출',

/* 좌우 밀기 감지 (터치·마우스 공통) */
function swipe(el, go){
  let x0 = null;
  el.onpointerdown = e => { x0 = e.clientX; };
  el.onpointerup = e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); };

}

function segList(seg, cat){

  if (seg === 'past') return l.sort((a,b) => (b.deadline || b.posted || '').localeCompare(a.deadline || a.posted || ''));

/* 손잡이를 잡고 아래로 끌기: 100px 넘게 끌거나 빠르게 내리면 닫고, 아니면 제자리로 */
function dragClose(handle){
  const sh = $('#sheet'); let y0 = null, t0 = 0, dy = 0;
  handle.onpointerdown = e => { y0 = e.clientY; t0 = e.timeStamp; dy = 0; sh.classList.remove('back'); sh.classList.add('drag'); handle.setPointerCapture(e.pointerId); };
  handle.onpointermove = e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; };
  const end = e => {
    if (y0 === null) return; y0 = null; sh.classList.remove('drag');
    const fast = dy > 30 && dy / Math.max(1, e.timeStamp - t0) > 0.6;
    if (dy > 100 || fast) closeSheet();
    else { sh.classList.add('back'); sh.style.transform = ''; }
  };
  handle.onpointerup = end; handle.onpointercancel = end;
}

- "제목만 확인"이 붙은 글은 세부 내용을 모르니 원문 확인을 안내해라.
- 학년이 맞지 않는 활동은 추천하지 마라. 마감이 지난 것은 지났다고 말해라. 분류가 '학교 일정'이면 '날짜'가 그날이다.
- 해요체로 1~2문장, 40자 안팎으로 아주 짧게. 날짜는 M/D(요일). 공문투·이모지 금지.
- 키가 answer와 ids 두 개뿐인 JSON 객체 하나만 답해라. answer = 학생에게 보여 줄 실제 답 문장, ids = 근거가 된 글 id 배열(0~3개, 목록에 있는 것만). 글 id는 answer 문장에 쓰지 마라.

[안내 목록]
${contextText()}

학생 질문: ${JSON.stringify(q)}`;
}
/* AI가 없을 때: 키워드·기간으로 데이터에서 찾기 */
function localAnswer(q){
  let pool = ITEMS.filter(i => fits(i) && forMe(i));
  let range = null, when = '';
  if (/이번\s*주/.test(q)) { range = [0, 6]; when = '이번 주'; } else if (/다음\s*주/.test(q)) { range = [7, 13]; when = '다음 주'; } else if (/오늘/.test(q)) { range = [0, 0]; when = '오늘'; }
  if (range) pool = pool.filter(i => { const d = daysLeft(i); return d !== null && d >= range[0] && d <= range[1]; });
  if (/마감|신청/.test(q)) pool = pool.filter(i => i.kind === 'do' && i.cat !== 'schedule' && isOpen(i));
  const STOP = /^(이번|다음|오늘|주|마감|신청|몇|시|언제|뭐|무엇|어디|있어|있나|알려|알려줘|해줘|돼|되나|해|까지|시까지)$/;
  const words = q.replace(/[?!.,]/g, ' ').split(/\s+/)
    .map(w => w.replace(/(이야|야|는|은|이|가|을|를|에|에서|까지야|까지)$/, ''))
    .filter(w => w.length >= 2 && !STOP.test(w));
  if (/몇\s*시|시간/.test(q)) words.push('시간');   // '몇 시'는 '이용 시간' 같은 글과 연결
  if (words.includes('시험')) words.push('정기시험');   // '시험'은 정기시험을 먼저
  /* 제목에 맞으면 2점, 한마디·내용에 맞으면 1점. 같으면 열린 글 → 가까운 날짜 순 */
  const score = i => words.reduce((s, w) => s + (i.title.includes(w) ? 2 : 0) + ([i.one, i.what, catOf(i.cat).name].join(' ').includes(w) ? 1 : 0), 0);
  let ranked = pool.map(i => ({i, s: score(i)})).filter(x => x.s > 0).sort((a,b) => b.s - a.s || (isOpen(b.i) - isOpen(a.i)) || sortDL(a.i,b.i));
  if (ranked.length) ranked = ranked.filter(x => x.s >= ranked[0].s * 0.6);   // 1등과 점수 차이가 큰 글은 빼기
  let hits = words.length ? ranked.map(x => x.i)
                          : pool.filter(isOpen).sort(sortDL);
  hits = hits.slice(0, 3);
  if (!hits.length) return {answer: range && !words.length ? `${when}에 ${/마감|신청/.test(q) ? '마감되는 신청' : '예정된 일정'}은 없어요.` : '안내문에서 찾지 못했어요. 담임 선생님께 확인해 보세요.', ids:[]};
  return {answer: hits.length === 1 ? hits[0].one : `${hits[0].one} (관련 안내 ${hits.length}건)`, ids: hits.map(i => i.id)};
}
function openAsk(){
  showSheet(`
    <div class="ask sbar">${LOGO}<input id="q" type="text" maxlength="200" placeholder="무엇이든 물어보세요" aria-label="질문" autocomplete="off" data-autofocus>
      <button id="askGo" type="button" data-act="ask">묻기</button></div>
    <div class="ex">${EXAMPLES.map(e => `<button type="button" class="chip" data-q="${esc(e)}">${esc(e)}</button>`).join('')}</div>
    <p class="status" id="status" aria-live="polite"></p>
    <div id="ans" hidden></div>
    <p class="foot">${state.grade}학년 기준 · 서해고 홈페이지 안내문으로만 답해요.</p>`, true);
}
/* AI가 답 문장 안에 쓴 글 번호([s528359], (k1207) 등)를 지움. 근거 글은 아래 링크로 따로 보여 줌 */
const stripIds = t => String(t || '').replace(/\s*[\[(]\s*[skc]\d{3,}(\s*,\s*[skc]\d{3,})*\s*[\])]/g, '').replace(/\b[skc]\d{4,}\b\s*/g, '').replace(/\s{2,}/g, ' ').trim();
function showAnswer(r, by){
  r = { ...r, answer: stripIds(r.answer) || r.answer };
  const ids = (Array.isArray(r.ids) ? r.ids : []).filter(id => byId(id)).slice(0, 3);
  $('#ans').innerHTML = `<div class="say"><small>${by}</small><p>${esc(r.answer)}</p></div>
    ${ids.length ? `<div class="refs">${ids.map(id => { const it = byId(id); return `<button type="button" class="ref" data-id="${esc(id)}"><span>${esc(it.title)}</span>${badgeHTML(it)}<em>›</em></button>`; }).join('')}</div>` : ''}`;
  $('#ans').hidden = false;
}
/* 중계 서버에 질문 + 안내 목록을 보냄. 규칙(프롬프트)은 서버가 붙임. 35초 안에 답이 없으면 포기 */
async function askServer(q, signal){
  let late = false;
  const timer = setTimeout(() => { late = true; ctl?.abort(); }, 35000);
  try {
    const res = await fetch(AI_ENDPOINT, {
      method: 'POST', headers: { 'content-type': 'application/json' }, signal,
      body: JSON.stringify({ q, model: AI_MODEL, grade: state.grade, today: `${iso(TODAY)}(${'일월화수목금토'[TODAY.getDay()]}요일)`, list: contextText() }),
    });
    const r = await res.json().catch(() => ({}));
    if (!res.ok) throw { code: r.error || 'server' };
    return r;
  } catch (e) {
    if (e?.name === 'AbortError') throw { code: late ? 'timeout' : 'cancelled' };
    throw e?.code ? e : { code: 'network' };
  } finally { clearTimeout(timer); }
}
async function runAsk(q){
  if (busy){ ctl?.abort(); return; }
  q = String(q || '').trim().slice(0, 200);
  if (!q){ setStatus('질문을 적어 주세요.', true); return; }
  $('#ans').hidden = true;
  if (!sample && !AI_ENDPOINT){ showAnswer(localAnswer(q), '찾은 안내'); setStatus(''); return; }
  busy = true; ctl = new AbortController(); $('#askGo').textContent = '그만';
  /* 기다리는 동안 검색 답을 먼저 보여 주고, AI 답이 오면 바꿔 끼움 */
  const quick = localAnswer(q);
  showAnswer(quick, '먼저 찾은 안내');
  setStatus('<span class="spinner"></span>AI가 더 정확히 확인하고 있어요…');
  try {
    /* Claude 화면이면 Claude에게, 아니면 중계 서버(Gemini)에게 묻기 */
    const r = sample ? await sample.json(buildPrompt(q), { modelTier:'quick', signal: ctl.signal }) : await askServer(q, ctl.signal);
    const answer = typeof r?.answer === 'string' ? r.answer.trim() : '';
    if (!answer) throw {code:'invalid_json'};
    showAnswer({answer, ids:r.ids}, 'AI 답변'); setStatus('');
  } catch (e) {
    /* 실패하거나 멈추면 이미 보여 준 검색 답을 그대로 둠 */
    showAnswer(quick, '찾은 안내');
    if (e?.code === 'cancelled') setStatus('AI 확인을 멈췄어요.');
    else setStatus(ERR[e?.code] ? ERR[e.code] + ' 검색 결과를 보여 드려요.' : 'AI 연결이 안 돼서 검색 결과를 보여 드려요.', true);
  } finally { busy = false; const b = $('#askGo'); if (b) b.textContent = '묻기'; }
}

/* ---------- 탭 / 공통 ---------- */
function setTab(t){
  state.tab = t; if (t === 'all') state.page = 0;
  $('#v-home').hidden = t !== 'home'; $('#v-all').hidden = t !== 'all';
  document.querySelectorAll('nav.tabs button').forEach(b => b.dataset.tab === t ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  render();
}
function render(){ $('#whoLabel').textContent = `${state.grade}학년`; state.tab === 'home' ? renderHome() : renderAll(); }

document.addEventListener('click', e => {
  const t = e.target;
  const gp = t.closest('[data-grade]'); if (gp){ state.grade = +gp.dataset.grade; persist(); closeSheet(); return render(); }
  const tab = t.closest('nav.tabs [data-tab]'); if (tab) return setTab(tab.dataset.tab);
  const wk = t.closest('[data-week]'); if (wk){ state.week = Math.min(MAX_WEEK, Math.max(0, state.week + +wk.dataset.week)); return renderHome(); }
  const sg = t.closest('[data-seg]'); if (sg){ state.seg = sg.dataset.seg; state.cat = 'all'; state.page = 0; return renderAll(); }
  const ct = t.closest('[data-cat]'); if (ct){ state.cat = ct.dataset.cat; state.page = 0; return renderAll(); }
  const pg = t.closest('[data-page]'); if (pg){ state.page += +pg.dataset.page; return renderAll(); }
  const dy = t.closest('[data-day]'); if (dy) return openDay(dy.dataset.day);
  const a = t.closest('[data-act]');
  if (a){ if (a.dataset.act === 'goAll') return setTab('all'); if (a.dataset.act === 'openAsk') return openAsk(); if (a.dataset.act === 'ask') return runAsk($('#q').value); }
  const qq = t.closest('[data-q]'); if (qq){ $('#q').value = qq.dataset.q; return runAsk(qq.dataset.q); }
  const c = t.closest('[data-id]'); if (c) return openDetail(c.dataset.id);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'q'){ e.preventDefault(); runAsk(e.target.value); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.hero[role=button]')){ e.preventDefault(); openDetail(e.target.dataset.id); }
});
$('#scrim').addEventListener('click', closeSheet);
/* 학년 버튼: 누를 때마다 2→3→1→2 순으로 바뀜 */
$('#whoBtn').addEventListener('click', () => { state.grade = state.grade % 3 + 1; persist(); render(); });

let raf = 0;
new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }).observe($('#main'));
render();
/* 처음 연 사람(저장된 학년 없음)에게 학년을 한 번 물어봄. 고르지 않고 닫으면 2학년으로 저장 */
function askGrade(){
  showSheet(`<h3>몇 학년이에요?</h3><p class="foot" style="font-size:14px">학년에 맞는 안내만 골라 보여 드려요. 오른쪽 위 버튼으로 언제든 바꿀 수 있어요.</p>
    <div class="gpick">${[1,2,3].map(g => `<button type="button" data-grade="${g}">${g}학년</button>`).join('')}</div>`);
  onSheetClose = () => { persist(); };
}
if (![1,2,3].includes(saved.grade)) askGrade();
(async () => { try { sample = await window.claude?.use?.('sample'); } catch { sample = null; } })();
</script>
